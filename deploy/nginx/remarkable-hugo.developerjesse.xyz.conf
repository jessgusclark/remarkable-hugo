# Install (manual, after the cert exists):
#   sudo install -m 644 /tmp/remarkable-hugo.developerjesse.xyz.conf /etc/nginx/sites-available/
#   sudo ln -sf ../sites-available/remarkable-hugo.developerjesse.xyz.conf /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx

server {
    listen 80;
    listen [::]:80;
    server_name remarkable-hugo.developerjesse.xyz;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name remarkable-hugo.developerjesse.xyz;

    ssl_certificate /etc/letsencrypt/live/remarkable-hugo.developerjesse.xyz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/remarkable-hugo.developerjesse.xyz/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Content-Security-Policy "default-src 'none'; frame-ancestors 'none'" always;
    add_header Referrer-Policy "no-referrer" always;

    # Mailgun forwards the whole message (attachment included) as multipart.
    # The app caps an attachment at 30 MB.
    client_max_body_size 40m;

    location = /webhook {
        limit_except POST { deny all; }
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # The app acks before calling Claude, so this only covers the upload.
        proxy_read_timeout 60s;
    }

    location = /healthz {
        limit_except GET { deny all; }
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    location / {
        return 404;
    }
}
